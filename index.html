<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Bé Quét Mã Khám Phá</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%; height: 100%;
      background: #000;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    /* 1. Màn hình chào */
    #start-screen {
      position: fixed; inset: 0;
      background: linear-gradient(135deg, #ff7043, #ff5722);
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      color: #fff; text-align: center;
      padding: 24px; z-index: 100;
    }
    #start-screen h1 { font-size: 1.8rem; margin-bottom: 12px; }
    #start-screen p { font-size: 1.1rem; margin-bottom: 24px; opacity: 0.95; }
    .btn-start {
      background: #ffeb3b; color: #d84315;
      border: none; padding: 16px 36px;
      font-size: 1.25rem; font-weight: bold;
      border-radius: 50px; cursor: pointer;
      box-shadow: 0 6px 18px rgba(0,0,0,0.3);
    }

    /* 2. Màn hình Camera quét QR */
    #scanner-view {
      position: fixed; inset: 0;
      display: none; justify-content: center; align-items: center;
    }
    #reader {
      width: 100% !important; height: 100% !important;
      border: none !important;
    }
    #reader video {
      object-fit: cover !important;
      width: 100% !important; height: 100% !important;
    }
    .scan-overlay {
      position: absolute;
      width: 240px; height: 240px;
      border: 4px dashed #ffeb3b;
      border-radius: 20px;
      pointer-events: none;
      box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.55);
    }
    .scan-guide {
      position: absolute;
      top: calc(50% + 140px);
      color: #fff; font-size: 1.1rem; font-weight: 700;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
      pointer-events: none; text-align: center; width: 90%;
    }

    /* 3. Khung phát video toàn màn hình */
    #player-view {
      position: fixed; inset: 0;
      display: none; background: #000; z-index: 50;
      overflow: hidden;
    }

    /* Ép xoay ngang 90 độ bằng CSS nếu máy đang cầm dọc (Hỗ trợ 100% cả iOS & Android) */
    @media (orientation: portrait) {
      .rotate-container {
        width: 100vh !important;
        height: 100vw !important;
        transform: rotate(90deg);
        transform-origin: top left;
        position: absolute;
        top: 0;
        left: 100vw;
      }
    }

    @media (orientation: landscape) {
      .rotate-container {
        width: 100vw !important;
        height: 100vh !important;
      }
    }

    #edu-video {
      width: 100%; height: 100%;
      object-fit: contain;
      background: #000;
    }

    .btn-back {
      position: absolute; top: 16px; left: 16px;
      background: rgba(255, 255, 255, 0.85);
      color: #000; border: none;
      padding: 10px 18px; border-radius: 30px;
      font-weight: 800; font-size: 1rem;
      cursor: pointer; z-index: 60;
    }

    /* Nút bật tiếng nhấp nháy thu hút bé */
    #unmute-badge {
      display: none;
      position: absolute;
      bottom: 24px; right: 24px;
      background: #e91e63; color: #fff;
      padding: 12px 20px; border-radius: 30px;
      font-size: 1.1rem; font-weight: bold;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
      cursor: pointer; z-index: 70;
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- Màn hình chào -->
  <div id="start-screen">
    <h1>Bé Vui Khám Phá 🌟</h1>
    <p>Chạm vào nút để kích hoạt máy quét bài học nhé!</p>
    <button class="btn-start" onclick="initApp()">Bắt Đầu Quét Thẻ 🎬</button>
  </div>

  <!-- Màn hình quét -->
  <div id="scanner-view">
    <div id="reader"></div>
    <div class="scan-overlay"></div>
    <div class="scan-guide">Bé hãy đưa thẻ QR vào ô vàng nhé! ✨</div>
  </div>

  <!-- Trình phát Video -->
  <div id="player-view">
    <div class="rotate-container" id="rotator">
      <button class="btn-back" onclick="resumeScanning()">◀ Quét bài khác</button>
      <div id="unmute-badge" onclick="unmuteVideo()">🔊 Chạm bật tiếng</div>
      <video id="edu-video" playsinline webkit-playsinline controls></video>
    </div>
  </div>

  <script>
    let html5QrCode = null;
    let isProcessing = false;
    const scannerView = document.getElementById('scanner-view');
    const playerView = document.getElementById('player-view');
    const videoElement = document.getElementById('edu-video');
    const unmuteBadge = document.getElementById('unmute-badge');

    function initApp() {
      document.getElementById('start-screen').style.display = 'none';
      scannerView.style.display = 'flex';
      startScanner();
    }

    function startScanner() {
      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }

      const config = {
        fps: 10,
        qrbox: { width: 240, height: 240 }
      };

      Html5Qrcode.getCameras().then(devices => {
        if (devices && devices.length > 0) {
          let backCamera = devices.find(d => 
            d.label.toLowerCase().includes("back") || 
            d.label.toLowerCase().includes("sau") || 
            d.label.toLowerCase().includes("environment")
          );
          const cameraId = backCamera ? backCamera.id : devices[devices.length - 1].id;
          html5QrCode.start(cameraId, config, onScanSuccess)
            .catch(() => fallbackStart(config));
        } else {
          fallbackStart(config);
        }
      }).catch(() => fallbackStart(config));
    }

    function fallbackStart(config) {
      html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
        .catch(err => {
          alert("Vui lòng cấp quyền Camera trong Cài đặt trình duyệt nhé!");
        });
    }

    function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;

      let scannedContent = decodedText.trim();
      let videoSrc = "";

      if (scannedContent.endsWith('.mp4') || scannedContent.startsWith('http')) {
        videoSrc = scannedContent;
      } else {
        videoSrc = `videos/${scannedContent}.mp4`;
      }

      playVideoInline(videoSrc);
    }

    async function playVideoInline(sourceUrl) {
      // 1. Tắt camera
      if (html5QrCode && html5QrCode.isScanning) {
        await html5QrCode.stop();
      }

      scannerView.style.display = 'none';
      playerView.style.display = 'block';

      // 2. Thử xoay hệ thống nếu hỗ trợ, nếu không CSS @media ở trên sẽ tự xử lý xoay 90 độ
      try {
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock('landscape');
        }
      } catch (e) {}

      // 3. Tải video
      videoElement.src = sourceUrl;

      // 4. Cơ chế Autoplay đảm bảo 100% thành công:
      // Thử phát có tiếng trước
      videoElement.muted = false;
      let playPromise = videoElement.play();

      if (playPromise !== undefined) {
        playPromise.catch(error => {
          // Nếu trình duyệt chặn do có tiếng -> Mute rồi phát ngay lập tức
          console.log("Trình duyệt chặn tiếng, chuyển sang phát mute:", error);
          videoElement.muted = true;
          videoElement.play();
          unmuteBadge.style.display = 'block'; // Hiện nút "Bật tiếng" cho bé bấm
        });
      }

      videoElement.onended = () => {
        resumeScanning();
      };
    }

    function unmuteVideo() {
      videoElement.muted = false;
      unmuteBadge.style.display = 'none';
    }

    async function resumeScanning() {
      videoElement.pause();
      videoElement.currentTime = 0;
      unmuteBadge.style.display = 'none';

      try {
        if (screen.orientation && screen.orientation.unlock) {
          screen.orientation.unlock();
        }
      } catch (e) {}

      playerView.style.display = 'none';
      scannerView.style.display = 'flex';
      isProcessing = false;
      startScanner();
    }
  </script>
</body>
</html>
