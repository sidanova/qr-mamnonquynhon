<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bé Quét Mã Khám Phá</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%; height: 100%;
      background: #000;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    /* 1. Màn hình Chào ban đầu */
    #start-screen {
      position: fixed; inset: 0;
      background: linear-gradient(135deg, #ff7043, #ff5722);
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      color: #fff; text-align: center;
      padding: 24px; z-index: 100;
    }
    #start-screen h1 { font-size: 2rem; margin-bottom: 12px; }
    #start-screen p { font-size: 1.15rem; margin-bottom: 28px; opacity: 0.95; }
    .btn-start {
      background: #ffeb3b; color: #d84315;
      border: none; padding: 18px 40px;
      font-size: 1.35rem; font-weight: bold;
      border-radius: 50px; cursor: pointer;
      box-shadow: 0 6px 18px rgba(0,0,0,0.3);
      transition: transform 0.1s;
    }
    .btn-start:active { transform: scale(0.96); }

    /* 2. Màn hình Camera quét QR */
    #scanner-view {
      position: fixed; inset: 0;
      display: none; justify-content: center; align-items: center;
    }
    #reader {
      width: 100% !important; height: 100% !important;
      border: none !important;
    }
    #reader video {
      object-fit: cover !important;
      width: 100% !important; height: 100% !important;
    }
    .scan-overlay {
      position: absolute;
      width: 250px; height: 250px;
      border: 5px dashed #ffeb3b;
      border-radius: 24px;
      pointer-events: none;
      box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.55);
    }
    .scan-guide {
      position: absolute;
      top: calc(50% + 150px);
      color: #fff; font-size: 1.15rem; font-weight: 700;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
      pointer-events: none; text-align: center; width: 90%;
    }

    /* 3. Màn hình phát video toàn màn hình ngang */
    #player-view {
      position: fixed; inset: 0;
      display: none; background: #000; z-index: 50;
      width: 100vw; height: 100vh;
    }
    #edu-video {
      width: 100%; height: 100%;
      object-fit: contain;
      background: #000;
    }
    .btn-back {
      position: absolute; top: 16px; left: 16px;
      background: rgba(255, 255, 255, 0.85);
      color: #000; border: none;
      padding: 12px 20px; border-radius: 30px;
      font-weight: 800; font-size: 1.05rem;
      cursor: pointer; z-index: 60;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <!-- Màn hình chào -->
  <div id="start-screen">
    <h1>Bé Vui Khám Phá 🌟</h1>
    <p>Chạm vào nút bên dưới để mở ống kính quét thẻ bài học nhé!</p>
    <button class="btn-start" onclick="initApp()">Bé Bắt Đầu Xem 🎬</button>
  </div>

  <!-- Camera quét -->
  <div id="scanner-view">
    <div id="reader"></div>
    <div class="scan-overlay"></div>
    <div class="scan-guide">Bé hãy giơ thẻ QR vào giữa ô vuông nhé! ✨</div>
  </div>

  <!-- Phát Video -->
  <div id="player-view">
    <button class="btn-back" onclick="resumeScanning()">◀ Quét bài khác</button>
    <video id="edu-video" playsinline webkit-playsinline controls></video>
  </div>

  <script>
    let html5QrCode = null;
    let isProcessing = false;
    const scannerView = document.getElementById('scanner-view');
    const playerView = document.getElementById('player-view');
    const videoElement = document.getElementById('edu-video');

    async function initApp() {
      document.getElementById('start-screen').style.display = 'none';
      scannerView.style.display = 'flex';
      startScanner();
    }

    function startScanner() {
      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }

      const config = {
        fps: 10,
        qrbox: { width: 250, height: 250 }
      };

      // Tự động tìm camera sau trên thiết bị
      Html5Qrcode.getCameras().then(devices => {
        if (devices && devices.length > 0) {
          let backCamera = devices.find(d => 
            d.label.toLowerCase().includes("back") || 
            d.label.toLowerCase().includes("sau") || 
            d.label.toLowerCase().includes("environment")
          );
          const cameraId = backCamera ? backCamera.id : devices[devices.length - 1].id;

          html5QrCode.start(cameraId, config, onScanSuccess)
            .catch(() => fallbackStart(config));
        } else {
          fallbackStart(config);
        }
      }).catch(() => fallbackStart(config));
    }

    function fallbackStart(config) {
      html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
        .catch(err => {
          console.error("Camera error:", err);
          alert("Vui lòng cấp quyền truy cập Camera trong Cài đặt trình duyệt nhé!");
        });
    }

    function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;

      let videoId = decodedText.trim();
      if (videoId.includes('?v=')) {
        videoId = new URL(videoId).searchParams.get('v');
      } else if (videoId.startsWith('http')) {
        const parts = videoId.split('/');
        videoId = parts[parts.length - 1].replace('.mp4', '');
      }

      playVideo(videoId);
    }

    async function playVideo(videoId) {
      // 1. Tạm dừng quét
      if (html5QrCode && html5QrCode.isScanning) {
        await html5QrCode.stop();
      }

      scannerView.style.display = 'none';
      playerView.style.display = 'block';

      // 2. Kích hoạt toàn màn hình và Tự động xoay ngang màn hình (Landscape)
      try {
        if (playerView.requestFullscreen) {
          await playerView.requestFullscreen();
        } else if (playerView.webkitRequestFullscreen) {
          await playerView.webkitRequestFullscreen();
        }

        // Khóa màn hình xoay ngang (áp dụng rất nhạy trên Android Chrome)
        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock('landscape');
        }
      } catch (err) {
        console.log("Xoay ngang màn hình tự động không được hỗ trợ bởi thiết bị này:", err);
      }

      // 3. Tải và phát video
      videoElement.src = `videos/${videoId}.mp4`;
      videoElement.play().catch(e => console.log("Lỗi autoplay:", e));

      // 4. Khi video kết thúc, tự thoát toàn màn hình và quay về camera
      videoElement.onended = () => {
        resumeScanning();
      };
    }

    async function resumeScanning() {
      videoElement.pause();
      videoElement.currentTime = 0;

      // Mở khóa xoay màn hình và thoát Fullscreen
      try {
        if (screen.orientation && screen.orientation.unlock) {
          screen.orientation.unlock();
        }
        if (document.fullscreenElement || document.webkitFullscreenElement) {
          if (document.exitFullscreen) {
            await document.exitFullscreen();
          } else if (document.webkitExitFullscreen) {
            await document.webkitExitFullscreen();
          }
        }
      } catch (e) {
        console.log(e);
      }

      playerView.style.display = 'none';
      scannerView.style.display = 'flex';
      isProcessing = false;
      startScanner();
    }
  </script>
</body>
</html>
