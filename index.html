<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bé Quét Mã Khám Phá</title>
  <!-- Thư viện quét QR -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%; height: 100%;
      background: #000;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    /* 1. Màn hình Chào (Bắt buộc để xin quyền Camera & Âm thanh) */
    #start-screen {
      position: fixed; inset: 0;
      background: linear-gradient(135deg, #ff7043, #ff5722);
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      color: #fff; text-align: center;
      padding: 24px; z-index: 100;
    }
    #start-screen h1 { font-size: 2rem; margin-bottom: 12px; }
    #start-screen p { font-size: 1.15rem; margin-bottom: 28px; opacity: 0.95; }
    .btn-start {
      background: #ffeb3b; color: #d84315;
      border: none; padding: 18px 40px;
      font-size: 1.35rem; font-weight: bold;
      border-radius: 50px; cursor: pointer;
      box-shadow: 0 6px 18px rgba(0,0,0,0.3);
    }

    /* 2. Màn hình Camera quét QR */
    #scanner-view {
      position: fixed; inset: 0;
      display: none; justify-content: center; align-items: center;
    }
    #reader {
      width: 100% !important; height: 100% !important;
      border: none !important;
    }
    #reader video {
      object-fit: cover !important;
      width: 100% !important; height: 100% !important;
    }
    .scan-overlay {
      position: absolute;
      width: 250px; height: 250px;
      border: 5px dashed #ffeb3b;
      border-radius: 24px;
      pointer-events: none;
      box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.55);
    }
    .scan-guide {
      position: absolute;
      top: calc(50% + 150px);
      color: #fff; font-size: 1.15rem; font-weight: 700;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
      pointer-events: none; text-align: center; width: 90%;
    }

    /* 3. Trình phát Video ngay trên trang (Toàn màn hình & Tự xoay ngang) */
    #player-view {
      position: fixed; inset: 0;
      display: none; background: #000; z-index: 50;
      width: 100vw; height: 100vh;
    }
    #edu-video {
      width: 100%; height: 100%;
      object-fit: contain;
      background: #000;
    }
    .btn-back {
      position: absolute; top: 16px; left: 16px;
      background: rgba(255, 255, 255, 0.85);
      color: #000; border: none;
      padding: 12px 20px; border-radius: 30px;
      font-weight: 800; font-size: 1.05rem;
      cursor: pointer; z-index: 60;
    }
  </style>
</head>
<body>

  <!-- Màn hình chào -->
  <div id="start-screen">
    <h1>Bé Vui Khám Phá 🌟</h1>
    <p>Chạm vào nút để bật máy quét thẻ bài học nhé!</p>
    <button class="btn-start" onclick="initApp()">Bắt Đầu Quét Thẻ 🎬</button>
  </div>

  <!-- Khung Camera quét mã -->
  <div id="scanner-view">
    <div id="reader"></div>
    <div class="scan-overlay"></div>
    <div class="scan-guide">Bé hãy giơ thẻ QR vào giữa ô vuông nhé! ✨</div>
  </div>

  <!-- Trình phát video nằm cùng trang -->
  <div id="player-view">
    <button class="btn-back" onclick="resumeScanning()">◀ Quét bài khác</button>
    <video id="edu-video" playsinline webkit-playsinline controls></video>
  </div>

  <script>
    let html5QrCode = null;
    let isProcessing = false;
    const scannerView = document.getElementById('scanner-view');
    const playerView = document.getElementById('player-view');
    const videoElement = document.getElementById('edu-video');

    function initApp() {
      document.getElementById('start-screen').style.display = 'none';
      scannerView.style.display = 'flex';
      startScanner();
    }

    function startScanner() {
      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }

      const config = {
        fps: 10,
        qrbox: { width: 250, height: 250 }
      };

      // Tự động tìm camera sau
      Html5Qrcode.getCameras().then(devices => {
        if (devices && devices.length > 0) {
          let backCamera = devices.find(d => 
            d.label.toLowerCase().includes("back") || 
            d.label.toLowerCase().includes("sau") || 
            d.label.toLowerCase().includes("environment")
          );
          const cameraId = backCamera ? backCamera.id : devices[devices.length - 1].id;
          html5QrCode.start(cameraId, config, onScanSuccess)
            .catch(() => fallbackStart(config));
        } else {
          fallbackStart(config);
        }
      }).catch(() => fallbackStart(config));
    }

    function fallbackStart(config) {
      html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
        .catch(err => {
          console.error("Camera error:", err);
          alert("Vui lòng cấp quyền truy cập Camera trong Cài đặt trình duyệt nhé!");
        });
    }

    // Khi quét trúng mã QR
    function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;

      let scannedContent = decodedText.trim();
      let videoSrc = "";

      // 1. Nếu mã QR chứa link file trực tiếp (http... hoặc videos/...)
      if (scannedContent.endsWith('.mp4') || scannedContent.startsWith('http')) {
        videoSrc = scannedContent;
      } 
      // 2. Nếu mã QR chỉ chứa tên ngắn (ví dụ: video1)
      else {
        videoSrc = `videos/${scannedContent}.mp4`;
      }

      playVideoInline(videoSrc);
    }

    async function playVideoInline(sourceUrl) {
      // Tắt camera tạm thời
      if (html5QrCode && html5QrCode.isScanning) {
        await html5QrCode.stop();
      }

      // Ẩn camera, hiện trình phát video NGAY TRÊN TRANG (không đi đâu cả)
      scannerView.style.display = 'none';
      playerView.style.display = 'block';

      // Yêu cầu tự xoay ngang màn hình và toàn màn hình
      try {
        if (playerView.requestFullscreen) {
          await playerView.requestFullscreen();
        } else if (playerView.webkitRequestFullscreen) {
          await playerView.webkitRequestFullscreen();
        }

        if (screen.orientation && screen.orientation.lock) {
          await screen.orientation.lock('landscape');
        }
      } catch (err) {
        console.log("Xoay ngang màn hình không được hỗ trợ trên thiết bị này:", err);
      }

      // Nạp link video vừa quét được và tự động play
      videoElement.src = sourceUrl;
      videoElement.play().catch(e => console.log("Lỗi autoplay:", e));

      // Khi bé xem hết bài, tự động thoát xoay ngang và bật lại camera quét
      videoElement.onended = () => {
        resumeScanning();
      };
    }

    async function resumeScanning() {
      videoElement.pause();
      videoElement.currentTime = 0;

      // Thoát Fullscreen và mở khóa xoay màn hình
      try {
        if (screen.orientation && screen.orientation.unlock) {
          screen.orientation.unlock();
        }
        if (document.fullscreenElement || document.webkitFullscreenElement) {
          if (document.exitFullscreen) {
            await document.exitFullscreen();
          } else if (document.webkitExitFullscreen) {
            await document.webkitExitFullscreen();
          }
        }
      } catch (e) {
        console.log(e);
      }

      playerView.style.display = 'none';
      scannerView.style.display = 'flex';
      isProcessing = false;
      startScanner();
    }
  </script>
</body>
</html>
