<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Bé Quét Mã Khám Phá</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html {
      width: 100%; height: 100%;
      background: #000;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }

    /* 1. Màn hình Chào / Kích hoạt Camera */
    #start-screen {
      position: fixed; inset: 0;
      background: linear-gradient(135deg, #4CAF50, #2E7D32);
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      color: #fff; text-align: center;
      padding: 24px; z-index: 100;
    }
    #start-screen h1 { font-size: 1.8rem; margin-bottom: 12px; }
    #start-screen p { font-size: 1.1rem; margin-bottom: 24px; opacity: 0.9; }
    .btn-start {
      background: #ffeb3b; color: #1b5e20;
      border: none; padding: 16px 36px;
      font-size: 1.3rem; font-weight: bold;
      border-radius: 50px; cursor: pointer;
      box-shadow: 0 6px 16px rgba(0,0,0,0.25);
    }

    /* 2. Khung Camera */
    #scanner-view {
      position: fixed; inset: 0;
      display: none; justify-content: center; align-items: center;
    }
    #reader {
      width: 100% !important; height: 100% !important;
      border: none !important;
    }
    #reader video {
      object-fit: cover !important;
      width: 100% !important; height: 100% !important;
    }

    /* Khung ngắm cho bé */
    .scan-overlay {
      position: absolute;
      width: 240px; height: 240px;
      border: 4px dashed #ffeb3b;
      border-radius: 20px;
      pointer-events: none;
      box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.5);
    }
    .scan-guide {
      position: absolute;
      top: calc(50% + 140px);
      color: #fff; font-size: 1.1rem; font-weight: 600;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      pointer-events: none; text-align: center;
      width: 90%;
    }

    /* 3. Khung Phát Video */
    #player-view {
      position: fixed; inset: 0;
      display: none; background: #000; z-index: 50;
    }
    #edu-video {
      width: 100%; height: 100%; object-fit: contain;
    }
    .btn-back {
      position: absolute; top: 16px; left: 16px;
      background: rgba(255, 255, 255, 0.9);
      color: #111; border: none;
      padding: 10px 18px; border-radius: 20px;
      font-weight: bold; font-size: 1rem;
      cursor: pointer; z-index: 60;
    }
  </style>
</head>
<body>

  <!-- Màn hình xin quyền -->
  <div id="start-screen">
    <h1>Bé Khám Phá Tri Thức 🎒</h1>
    <p>Nhấn nút bên dưới để mở camera quét thẻ video nhé!</p>
    <button class="btn-start" onclick="initApp()">Bật Camera 📷</button>
  </div>

  <!-- Màn hình quét Camera -->
  <div id="scanner-view">
    <div id="reader"></div>
    <div class="scan-overlay"></div>
    <div class="scan-guide">Bé hãy đưa thẻ QR vào ô vàng nhé! ✨</div>
  </div>

  <!-- Màn hình xem Video -->
  <div id="player-view">
    <button class="btn-back" onclick="resumeScanning()">◀ Quét thẻ khác</button>
    <video id="edu-video" playsinline webkit-playsinline controls></video>
  </div>

  <script>
    let html5QrCode = null;
    let isProcessing = false;

    async function initApp() {
      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('scanner-view').style.display = 'flex';

      startScanner();
    }

    function startScanner() {
      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }

      const config = {
        fps: 10,
        qrbox: { width: 240, height: 240 }
      };

      // Gọi camera sau với quyền người dùng kích hoạt
      html5QrCode.start(
        { facingMode: { exact: "environment" } },
        config,
        onScanSuccess
      ).catch(() => {
        // Dự phòng cho máy tính hoặc thiết bị không có cờ "exact environment"
        html5QrCode.start(
          { facingMode: "user" },
          config,
          onScanSuccess
        ).catch(err => {
          alert("Không thể mở Camera: Vui lòng vào Cài đặt trình duyệt để Cấp quyền Camera cho trang web.");
          console.error(err);
        });
      });
    }

    function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;

      let videoId = decodedText.trim();
      if (videoId.includes('?v=')) {
        videoId = new URL(videoId).searchParams.get('v');
      } else if (videoId.startsWith('http')) {
        const parts = videoId.split('/');
        videoId = parts[parts.length - 1].replace('.mp4', '');
      }

      playVideo(videoId);
    }

    async function playVideo(videoId) {
      if (html5QrCode && html5QrCode.isScanning) {
        await html5QrCode.stop();
      }

      document.getElementById('scanner-view').style.display = 'none';
      document.getElementById('player-view').style.display = 'block';

      const videoElement = document.getElementById('edu-video');
      videoElement.src = `videos/${videoId}.mp4`;
      videoElement.play().catch(e => console.log("Lỗi autoplay âm thanh:", e));

      videoElement.onended = () => {
        resumeScanning();
      };
    }

    function resumeScanning() {
      const videoElement = document.getElementById('edu-video');
      videoElement.pause();
      videoElement.currentTime = 0;
      document.getElementById('player-view').style.display = 'none';
      document.getElementById('scanner-view').style.display = 'flex';
      isProcessing = false;
      startScanner();
    }
  </script>
</body>
</html>
